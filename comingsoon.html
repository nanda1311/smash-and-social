<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smashhh & Social - Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3efe4;
      color: #2b3a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .banner-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #f3efe4;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .banner-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .newsletter-section {
      margin-top: 20px;
    }

    .newsletter-form {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
    }

    .newsletter-form input[type="email"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #dcdfd9;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background-color: #ffffff;
      color: #2b3a4a;
    }

    .newsletter-form input[type="email"]:focus {
      border-color: #a1be0c;
    }

    .newsletter-form button {
      padding: 12px 24px;
      background-color: #a1be0c;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .newsletter-form button:hover {
      background-color: #8fa80a;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="banner-wrapper">
      <!-- Replace 'your-image-path.png' with the actual image file path or URL -->
      <img src="images/coming-soon.png" alt="Smashhhing Soon - Badminton, Cafe, Fitness, Merchandise">
    </div>
  </main>

</body>
</html>
